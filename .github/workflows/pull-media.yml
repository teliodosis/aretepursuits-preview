name: pull-media
on: workflow_dispatch
permissions:
  contents: write
jobs:
  media:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get -qq update && sudo apt-get -qq install -y ffmpeg >/dev/null
      - run: pip install -q pillow
      - run: python3 scripts/pull_media.py
      - run: |
          git config user.name "content-bot"
          git config user.email "actions@users.noreply.github.com"
          git add media content
          git diff --cached --quiet || git commit -q -m "Pull and resize WordPress media"
          git push
