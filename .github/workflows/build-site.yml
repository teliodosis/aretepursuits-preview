name: build-site
on:
  push:
    branches: [main]
    paths: ['content/**', 'src/**', 'scripts/**', 'media/**', 'baseline/img/**', '.github/workflows/build-site.yml']
  schedule:
    - cron: '5 13 * * 1'   # 9:05 Eastern (summer) on Mondays, for scheduled posts
    - cron: '5 14 * * 1'   # 9:05 Eastern (winter)
    - cron: '20 13 * * 1'  # 9:20 Eastern backup (summer), in case GitHub starts the 9:05 run late
    - cron: '20 14 * * 1'  # 9:20 Eastern backup (winter)
  workflow_dispatch:
permissions:
  contents: write
concurrency: build-site
env:
  # REVIEW: '1' removed at cutover (Oct 17 2026) so search engines can index aretepursuits.com
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install -q beautifulsoup4 pillow
      - run: python3 scripts/build_site.py dist
      - name: Publish to the site branch
        run: |
          cd dist
          git init -q -b site
          git config user.name "site-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -q -m "Site build from ${GITHUB_SHA::7}"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" site
