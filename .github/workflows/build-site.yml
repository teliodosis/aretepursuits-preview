name: build-site
on:
  push:
    branches: [main]
    paths: ['content/**', 'src/**', 'scripts/**', 'media/**', 'baseline/img/**', '.github/workflows/build-site.yml']
  schedule:
    # Mondays, for scheduled posts (dated 6:00 AM Eastern). GitHub's scheduler is best effort:
    # runs can start hours late or be skipped (none ran on Nov 2, 2026), hence the backups.
    - cron: '5 10 * * 1'   # 6:05 Eastern (summer)
    - cron: '5 11 * * 1'   # 6:05 Eastern (winter)
    - cron: '20 10 * * 1'  # 6:20 Eastern backup (summer)
    - cron: '20 11 * * 1'  # 6:20 Eastern backup (winter)
    - cron: '30 12 * * 1'  # 8:30 Eastern second backup (summer)
    - cron: '30 13 * * 1'  # 8:30 Eastern second backup (winter)
  workflow_dispatch:
permissions:
  contents: write
concurrency: build-site
# REVIEW: '1' env removed at cutover (Oct 17 2026) so search engines can index aretepursuits.com
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install -q beautifulsoup4 pillow
      - run: python3 scripts/build_site.py dist
      - name: Publish to the site branch
        run: |
          cd dist
          git init -q -b site
          git config user.name "site-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -q -m "Site build from ${GITHUB_SHA::7}"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" site
