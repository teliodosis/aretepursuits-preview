name: verify-site
on:
  workflow_dispatch:
    inputs:
      base:
        default: https://site.aretepursuits-preview.pages.dev
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/verify_site.sh "${{ inputs.base }}"
      - run: |
          git config user.name "content-bot"
          git config user.email "actions@users.noreply.github.com"
          git add reports
          git diff --cached --quiet || git commit -q -m "Site verification report"
          git pull -q --rebase && git push
