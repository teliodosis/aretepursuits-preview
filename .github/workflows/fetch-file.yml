name: fetch-file
on:
  workflow_dispatch:
    inputs:
      url: { required: true }
      dest: { required: true }
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: curl -sSfL -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/128.0 Safari/537.36" -o "${{ inputs.dest }}" "${{ inputs.url }}" && ls -la "${{ inputs.dest }}"
      - name: Keep only the redirect rules from a Redirection export
        if: endsWith(inputs.dest, 'redirection-export.json')
        run: |
          python3 - "${{ inputs.dest }}" <<'PY'
          import json, sys
          d = json.load(open(sys.argv[1]))
          keep = [{k: r.get(k) for k in ('url', 'match_url', 'match_type', 'regex', 'action_type', 'action_code', 'action_data', 'status', 'last_count', 'group_id', 'title')} for r in d.get('redirects', [])]
          json.dump({'keys': sorted(d.keys()), 'redirects': keep}, open(sys.argv[1], 'w'), indent=1)
          print(len(keep), 'redirects kept; top-level keys', sorted(d.keys()))
          PY
      - run: |
          git config user.name "content-bot"
          git config user.email "actions@users.noreply.github.com"
          git add "${{ inputs.dest }}"
          git diff --cached --quiet || git commit -q -m "Fetch ${{ inputs.dest }}"
          git pull -q --rebase && git push
