name: probe-redirects
on: workflow_dispatch
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/probe_redirects.sh
      - run: |
          git config user.name "content-bot"
          git config user.email "actions@users.noreply.github.com"
          git pull -q --rebase
          git add content
          git diff --cached --quiet || git commit -q -m "Record legacy redirects"
          git pull -q --rebase && git push
