name: pull-content
on: workflow_dispatch
permissions:
  contents: write
jobs:
  pull:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/pull_content.py
      - run: |
          git config user.name "content-bot"
          git config user.email "actions@users.noreply.github.com"
          git add content
          git diff --cached --quiet || git commit -m "Pull WordPress content"
          git push
