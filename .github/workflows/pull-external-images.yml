name: pull-external-images
on: workflow_dispatch
permissions:
  contents: write
jobs:
  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install -q pillow && python3 scripts/pull_external_images.py
      - run: |
          git config user.name "content-bot"
          git config user.email "actions@users.noreply.github.com"
          git add media content
          git diff --cached --quiet || git commit -q -m "Copy hotlinked images into the site"
          git pull -q --rebase && git push
