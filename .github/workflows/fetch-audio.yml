name: fetch-audio
on:
  workflow_dispatch:
    inputs:
      items:
        description: 'JSON list of {"slug": ..., "url": ...}'
        required: true
permissions:
  contents: write
jobs:
  audio:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get -qq update && sudo apt-get -qq install -y ffmpeg >/dev/null
      - name: Download and encode narration for the web
        env:
          ITEMS: ${{ inputs.items }}
        run: |
          python3 - <<'PY'
          import json, os, subprocess, urllib.request
          items = json.loads(os.environ['ITEMS'])
          os.makedirs('media/audio', exist_ok=True)
          idx = json.load(open('content/audio.json')) if os.path.exists('content/audio.json') else {}
          for it in items:
              tmp = '/tmp/' + it['slug'] + '.src'
              urllib.request.urlretrieve(it['url'], tmp)
              out = f"media/audio/{it['slug']}.mp3"
              subprocess.run(['ffmpeg', '-y', '-loglevel', 'error', '-i', tmp, '-ac', '1', '-ar', '44100', '-b:a', '80k', out], check=True)
              dur = float(subprocess.run(['ffprobe', '-v', 'error', '-show_entries', 'format=duration', '-of', 'csv=p=0', out], capture_output=True, text=True).stdout.strip())
              idx[it['slug']] = {'src': '/' + out[len('media/'):], 'seconds': round(dur), 'bytes': os.path.getsize(out), 'from': it.get('from', '')}
              print(it['slug'], round(dur), os.path.getsize(out))
          json.dump(idx, open('content/audio.json', 'w'), indent=1, sort_keys=True)
          PY
      - run: |
          git config user.name "content-bot"
          git config user.email "actions@users.noreply.github.com"
          git add media/audio content/audio.json
          git diff --cached --quiet || git commit -q -m "Add narration audio"
          git pull -q --rebase && git push
